server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA service worker + manifest must not be cached
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.json    { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # SPA history-mode fallback. Never cache the app shell (index.html) so new
    # deploys load immediately — otherwise Cloudflare/browsers can keep serving a
    # stale shell that references old (now-missing) hashed chunks.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
