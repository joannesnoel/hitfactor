# Reference for the Secrets the manifests expect. DO NOT commit real values.
# Prefer creating these with `kubectl create secret` (see README) so keys/passwords
# never land in git. This file only documents the shape.
---
apiVersion: v1
kind: Secret
metadata:
  name: hitfactor-db
  namespace: hitfactor
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql://hitfactor:CHANGE_ME@hitfactor-postgres:5432/hitfactor
---
apiVersion: v1
kind: Secret
metadata:
  name: hitfactor-jwt
  namespace: hitfactor
type: Opaque
stringData:
  # RS256 keypair (PKCS8 private / SPKI public) — mounted at dist/config/keys.
  private.pem: |
    -----BEGIN PRIVATE KEY-----
    ...
    -----END PRIVATE KEY-----
  public.pem: |
    -----BEGIN PUBLIC KEY-----
    ...
    -----END PUBLIC KEY-----
# hitfactor-powersync-config is created from powersync.prod.yaml — see README.
