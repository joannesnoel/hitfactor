# Self-hosted GitHub Actions runner for the hitfactor repo, matching the
# nvyt / gopickle pattern. The GitHub PAT secret is shared across runners:
#   kubectl -n github-actions get secret github-runner-secret   # already exists
# Apply the ServiceAccount + RBAC any time; apply the Deployment AFTER the repo
# exists on GitHub (REPO_URL below) so the runner can register.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-hitfactor
  namespace: github-actions
---
# Grants the runner SA just enough to deploy into the hitfactor namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-runner-role
  namespace: hitfactor
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runner-binding
  namespace: hitfactor
subjects:
  - kind: ServiceAccount
    name: github-runner-hitfactor
    namespace: github-actions
roleRef:
  kind: Role
  name: github-runner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-hitfactor
  namespace: github-actions
  labels:
    app: github-runner-hitfactor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner-hitfactor
  template:
    metadata:
      labels:
        app: github-runner-hitfactor
    spec:
      serviceAccountName: github-runner-hitfactor
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        # Docker-in-Docker for building images; trusts the insecure registry
        - name: dind
          image: docker:24-dind
          args: ["--insecure-registry=192.168.0.20:30500"]
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "6", memory: "8Gi" }
          volumeMounts:
            - { name: docker-storage, mountPath: /var/lib/docker }
            - { name: runner-workdir, mountPath: /tmp/runner }
        - name: runner
          image: myoung34/github-runner:latest
          imagePullPolicy: Always
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: REPO_URL
              value: https://github.com/joannesnoel/hitfactor
            - name: RUNNER_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: RUNNER_WORKDIR
              value: /tmp/runner
            - name: LABELS
              value: self-hosted,k3s,hitfactor
            - name: RUNNER_SCOPE
              value: repo
            - name: DISABLE_AUTO_UPDATE
              value: "true"
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: GITHUB_PAT
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          volumeMounts:
            - { name: runner-workdir, mountPath: /tmp/runner }
      volumes:
        - { name: docker-storage, emptyDir: {} }
        - { name: runner-workdir, emptyDir: {} }
