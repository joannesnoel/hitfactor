apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hitfactor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: hitfactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: hitfactor
    spec:
      containers:
        - name: frontend
          # Rebuild this image whenever VITE_API_URL (the API hostname) changes.
          image: 192.168.0.20:30500/hitfactor-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hitfactor-frontend
  namespace: hitfactor
spec:
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hitfactor
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: hitfactor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Cloudflare Flexible mode (edge HTTPS -> origin HTTP): don't redirect at origin.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [hitfactor.creativelogik.net]
      secretName: hitfactor-web-tls
  rules:
    - host: hitfactor.creativelogik.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hitfactor-frontend
                port:
                  number: 80
