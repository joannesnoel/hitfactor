apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-env
  namespace: hitfactor
data:
  NODE_ENV: production
  PORT: "3000"
  HOST: 0.0.0.0
  LOG_LEVEL: info
  JWT_ISSUER: hitfactor
  JWT_AUDIENCE: hitfactor-app
  # Public hostnames — must match the Ingress hosts below.
  POWERSYNC_URL: https://sync.hitfactor.net
  CORS_ORIGIN: https://hitfactor.net
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hitfactor
spec:
  replicas: 1 # keep at 1 unless JWT keys are a shared Secret (they are, below)
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: hitfactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: hitfactor
    spec:
      containers:
        - name: backend
          image: registry.lan:5000/hitfactor-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-env
            # S3 (Garage) credentials for match banners — per-namespace Secret.
            - secretRef:
                name: hitfactor-s3
            # SMTP (email) credentials — per-namespace Secret. Optional so the
            # backend still boots where SMTP isn't configured yet (email is then
            # logged-and-skipped rather than sent).
            - secretRef:
                name: hitfactor-smtp
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hitfactor-db
                  key: DATABASE_URL
          volumeMounts:
            # jwt.ts loads keys from <dist>/config/keys at runtime
            - name: jwt-keys
              mountPath: /app/backend/dist/config/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: jwt-keys
          secret:
            secretName: hitfactor-jwt
---
apiVersion: v1
kind: Service
metadata:
  name: hitfactor-backend
  namespace: hitfactor
spec:
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: hitfactor
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: hitfactor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Cloudflare proxies in Flexible mode (edge HTTPS -> origin HTTP); the origin
    # must NOT redirect to HTTPS or it loops. cert-manager still issues the origin
    # LE cert (used for direct access / a future Full-strict switch).
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.hitfactor.net]
      secretName: hitfactor-api-tls
  rules:
    - host: api.hitfactor.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hitfactor-backend
                port:
                  number: 3000
