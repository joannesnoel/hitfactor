# Runs Drizzle migrations against the app DB. Apply (or re-apply) this before
# rolling out a backend image that expects new schema. Idempotent: drizzle
# skips already-applied migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: hitfactor-migrate
  namespace: hitfactor
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: hitfactor
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: 192.168.0.20:30500/hitfactor-backend:latest
          workingDir: /app/backend
          command: ["node", "dist/db/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hitfactor-db
                  key: DATABASE_URL
