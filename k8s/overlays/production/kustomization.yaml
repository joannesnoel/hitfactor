# Production overlay: base workloads as-is (prod hostnames) in the hitfactor
# namespace.  kubectl apply -k k8s/overlays/production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hitfactor

resources:
  - namespace.yaml
  - ../../base

images:
  - name: registry.lan:5000/hitfactor-backend
    newTag: prod # env-specific floating tag (CI keeps it current); never :latest,
    # which is shared with staging and would bake the wrong API URL into the SPA
  - name: registry.lan:5000/hitfactor-frontend
    newTag: prod # env-specific floating tag (CI keeps it current); never :latest,
    # which is shared with staging and would bake the wrong API URL into the SPA
