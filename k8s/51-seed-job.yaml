# OPTIONAL dev fixtures (test users w/ password123, sample match + stages).
# Do NOT run against a real production database. Delete the Job before re-running.
apiVersion: batch/v1
kind: Job
metadata:
  name: hitfactor-seed
  namespace: hitfactor
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/part-of: hitfactor
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: 192.168.0.20:30500/hitfactor-backend:latest
          workingDir: /app/backend
          command: ["node", "dist/db/seed.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hitfactor-db
                  key: DATABASE_URL
