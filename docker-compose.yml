services:
  postgres:
    image: postgres:16
    container_name: hitfactor-postgres
    environment:
      POSTGRES_DB: hitfactor
      POSTGRES_USER: hitfactor
      POSTGRES_PASSWORD: hitfactor_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitfactor"]
      interval: 5s
      timeout: 5s
      retries: 5

  powersync:
    image: journeyapps/powersync-service:1.13.4
    container_name: hitfactor-powersync
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      # Linux: lets the container reach the host-run backend for JWKS
      - "host.docker.internal:host-gateway"
    environment:
      # Dev only: backend uses a self-signed cert for the JWKS endpoint
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - ./backend/powersync.yaml:/powersync.yaml
      - ./backend/sync-rules.yaml:/sync-rules.yaml
    command: ["start", "-c", "/powersync.yaml"]

volumes:
  pgdata:
