name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - '**.md'
      - '.gitignore'
      - '.claude/**'
      - 'LICENSE'

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: [self-hosted, k3s, hitfactor]
    environment: production

    env:
      REGISTRY: registry.lan:5000
      BACKEND_IMAGE: hitfactor-backend
      FRONTEND_IMAGE: hitfactor-frontend
      NAMESPACE: hitfactor
      VITE_API_URL: https://api.hitfactor.net

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kubectl
        run: |
          # The self-hosted runner is long-lived, so kubectl persists between
          # runs — skip the (slow, occasionally-hanging) re-download when present.
          if command -v kubectl >/dev/null 2>&1; then
            echo "kubectl already installed: $(kubectl version --client 2>/dev/null | head -1)"
          else
            VER="$(curl -sL --retry 3 --max-time 20 https://dl.k8s.io/release/stable.txt)"
            curl -LO --retry 3 --max-time 120 "https://dl.k8s.io/release/${VER}/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
            kubectl version --client
          fi

      - name: Configure kubectl
        run: |
          # In-cluster ServiceAccount credentials (runner pod SA)
          kubectl config set-cluster k3s --server=https://kubernetes.default.svc --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials github-runner --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          kubectl config set-context default --cluster=k3s --user=github-runner
          kubectl config use-context default
          kubectl get pods -n ${{ env.NAMESPACE }} --no-headers | head -1

      - name: Generate image tag
        id: tag
        run: |
          TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${TAG}"

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:prod .
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:prod

      - name: Build and push frontend image
        run: |
          # VITE_API_URL is baked at build time (see frontend/Dockerfile)
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ env.VITE_API_URL }} \
            -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:prod .
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:prod

      - name: Run database migrations
        run: |
          kubectl delete job hitfactor-migrate -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: hitfactor-migrate
            namespace: ${{ env.NAMESPACE }}
            labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: hitfactor }
          spec:
            backoffLimit: 2
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
                    imagePullPolicy: Always
                    workingDir: /app/backend
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom: { secretKeyRef: { name: hitfactor-db, key: DATABASE_URL } }
          EOF
          echo "Waiting for migration job..."
          kubectl wait --for=condition=complete job/hitfactor-migrate -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Deploy to k3s
        run: |
          kubectl set image deployment/backend  backend=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}   -n ${{ env.NAMESPACE }}
          kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }} -n ${{ env.NAMESPACE }}
          # Auto-recompute worker (applied manually; skip if not present)
          kubectl set image deployment/recompute-worker recompute-worker=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }} -n ${{ env.NAMESPACE }} 2>/dev/null || echo "recompute-worker not deployed; skipping"
          kubectl rollout status deployment/backend  -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/recompute-worker -n ${{ env.NAMESPACE }} --timeout=120s 2>/dev/null || true

      - name: Verify health check
        run: |
          # Use the in-cluster ClusterIP so this works regardless of public DNS/TLS
          IP=$(kubectl get svc hitfactor-backend -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.clusterIP}')
          echo "Health-checking http://${IP}:3000/api/health"
          for i in $(seq 1 30); do
            if curl -sf "http://${IP}:3000/api/health" >/dev/null 2>&1; then
              echo "Health check passed!"; exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 5s..."; sleep 5
          done
          echo "Health check failed after 30 attempts"; exit 1
